services:
  - type: web
    name: propfyndr-backend
    env: node
    nodeVersion: 22
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI providers, in FALLBACK_CHAIN order (backend/src/lib/config.ts).
      # GEMINI_API_KEY is tier 1 and was missing here, so a deploy provisioned
      # purely from this file would silently start on a fallback provider.
      - key: GEMINI_API_KEY
        sync: false
      # Gates tool calling for Gemini, which is tier 1 and therefore nearly all
      # traffic. Drives both the tool definitions and the system prompt from one
      # constant, so the two cannot disagree. Off means every lookup — floor
      # plans, price history, cost sheets, builder records, RERA, the calculators
      # — is unreachable and the model answers from the NO LIVE LOOKUPS branch.
      - key: ENABLE_GEMINI_TOOLS
        value: "true"
      - key: GEMINI_LEG_MAX_DURATION_MS
        value: "45000"
      - key: FALLBACK_TURN_BUDGET_MS
        value: "30000"
      - key: GEMINI_API_KEY1
        sync: false
      - key: GROQ_API_KEY1
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false
      - key: OPENAI_API_KEY1
        sync: false
      - key: OPENAI_API_KEY2
        sync: false
      - key: OPENAI_API_KEY3
        sync: false
      - key: CEREBRAS_API_KEY1
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.posthog.com
      - key: MISTRAL_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Dedicated key for AI blog drafts so blog generation never spends the
      # chat's Groq quota. Falls back to GROQ_API_KEY when unset.
      - key: GROQ_BLOG_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        value: none
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_RECIPIENT_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false

  # Daily AI blog DRAFT (never publishes). 03:30 UTC = 09:00 IST. Calls the
  # backend's internal endpoint, which skips if a draft already exists today.
  - type: cron
    name: propfyndr-blog-daily-draft
    env: node
    schedule: "30 3 * * *"
    buildCommand: "true"
    startCommand: >-
      node -e "fetch(process.env.BACKEND_URL + '/api/v1/internal/blog/daily-draft',
      {method:'POST', headers:{'x-internal-key': process.env.INTERNAL_API_KEY}})
      .then(async r => { console.log(r.status, await r.text()); if (r.status >= 500) process.exit(1) })
      .catch(e => { console.error(e); process.exit(1) })"
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
