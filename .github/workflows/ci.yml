name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          
      - name: Install dependencies (Root)
        run: npm ci

      - name: Generate Prisma Clients
        run: |
          cd frontend && npx prisma generate
          cd ../backend && npm run db:generate
          
      - name: Run Typecheck & Lint (Frontend)
        working-directory: ./frontend
        run: npm run check-all
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        
      - name: Run Typecheck & Lint (Backend)
        working-directory: ./backend
        run: npm run check-all

  test:
    name: Test Suite & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realtyask_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Clients
        run: |
          cd frontend && npx prisma generate
          cd ../backend && npm run db:generate

      - name: Enable pgvector extension
        run: psql postgresql://postgres:postgres@localhost:5432/realtyask_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Backend DB Push
        working-directory: ./backend
        run: npx prisma db push --schema=${{ github.workspace }}/frontend/prisma/schema.prisma --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realtyask_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/realtyask_test

      # `npm test` is now a chain (jest, then the node:test suite), so extra argv
      # cannot be forwarded with `-- --passWithNoTests` — it would be appended to
      # the second command in the chain, not to jest.
      - name: Frontend unit tests
        working-directory: ./frontend
        run: npm test
        env:
          NODE_ENV: test

      - name: Backend unit tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realtyask_test
          REDIS_URL: redis://localhost:6379
          ADMIN_PASSWORD: test-admin-password
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

      - name: Frontend build
        run: cd frontend && npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json,./backend/coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  coverage-gate:
    name: Coverage Gate Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      # This job used to be a list of echoed checkmarks: it asserted nothing and
      # passed even if every file below had been deleted. It now verifies each
      # safety-critical suite still exists AND still contains real assertions,
      # so a file that gets emptied or converted to `todo` placeholders fails CI.
      - name: Check safety test coverage
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            local path="$1" desc="$2"
            if [ ! -f "$path" ]; then
              echo "MISSING  $path — $desc"
              fail=1
              return
            fi
            # Count assertions that are not asserting a constant.
            local n
            n=$(grep -cE '(assert|expect)\b' "$path" | head -1)
            local placebo
            placebo=$(grep -cE 'assert(\.ok)?\(\s*true\b' "$path" || true)
            local real=$(( n - placebo ))
            if [ "$real" -lt 5 ]; then
              echo "WEAK     $path — only $real real assertions ($desc)"
              fail=1
            else
              echo "ok       $path — $real assertions ($desc)"
            fi
          }

          check backend/src/lib/ai/__tests__/guardrails.test.ts        "prompt injection, RERA hallucination, price/name fabrication"
          check backend/src/lib/discovery/__tests__/conversationEngine.test.ts "stage transitions, chip cap, dedup"
          check backend/src/lib/discovery/__tests__/scoring.test.ts    "ranking math"
          check backend/src/lib/discovery/__tests__/confidence.test.ts "confidence scoring"
          check backend/src/lib/__tests__/calculators.test.ts          "money math (EMI, GST, stamp duty)"
          check backend/src/lib/__tests__/adminAuth.test.ts            "session management, Bearer token"
          check backend/src/routes/__tests__/chat.test.ts              "cache logic, rate limiting, IDOR, fallback"
          check frontend/__tests__/MessageBubble.test.tsx              "chips cap 4, dedup, a11y"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Safety coverage gate failed."
            exit 1
          fi
          echo
          echo "All critical safety paths still carry real assertions."
